name: Backfill FastF1 season

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season to export (run once per year)
        required: true
        default: "2024"

permissions:
  contents: write

concurrency:
  group: fastf1-data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      F1_USERNAME: ${{ secrets.F1_USERNAME }}
      F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Formula 1 credentials
        run: |
          test -n "$F1_USERNAME" || (echo "Missing repository secret F1_USERNAME" && exit 1)
          test -n "$F1_PASSWORD" || (echo "Missing repository secret F1_PASSWORD" && exit 1)
      - name: Export completed sessions
        run: python scripts/export_history.py --start-year "${{ inputs.year }}" --end-year "${{ inputs.year }}" --continue-on-error
      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: backfill ${{ inputs.year }} season"
          git pull --rebase
          git push
