name: Update FastF1 data

on:
  workflow_dispatch:
    inputs:
      year:
        description: Season year
        required: true
        default: "2024"
      event:
        description: Event name or round number
        required: true
        default: "Monaco"
      session:
        description: Session code (Q, R, S, FP1...)
        required: true
        default: "Q"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      F1_USERNAME: ${{ secrets.F1_USERNAME }}
      F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check private data credentials
        run: |
          test -n "$F1_USERNAME" || (echo "Missing repository secret F1_USERNAME" && exit 1)
          test -n "$F1_PASSWORD" || (echo "Missing repository secret F1_PASSWORD" && exit 1)
      - name: Export session
        run: python scripts/export_sessions.py --append --session "${{ inputs.year }}" "${{ inputs.event }}" "${{ inputs.session }}"
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update ${{ inputs.year }} ${{ inputs.event }} ${{ inputs.session }}"
          git push

